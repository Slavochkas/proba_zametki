name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Decode keystore (if secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.VELVI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "VELVI_KEYSTORE_FILE=keystore/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found"
          else
            echo "::warning::VELVI_KEYSTORE_BASE64 not set - APK will be DEBUG-signed"
          fi
      - name: Build release APK
        env:
          VELVI_STORE_PASSWORD: ${{ secrets.VELVI_STORE_PASSWORD }}
          VELVI_KEY_ALIAS: ${{ secrets.VELVI_KEY_ALIAS }}
          VELVI_KEY_PASSWORD: ${{ secrets.VELVI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappCode=${{ github.run_number }}
          ls -la app/build/outputs/apk/release/
      - name: Remove keystore
        if: always()
        run: rm -rf keystore
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Create/update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
              --title "Build ${{ github.run_number }}" --notes "Automated build from ${GITHUB_SHA}"
          fi
